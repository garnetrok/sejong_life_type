<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>세종에서 사는 나에게 중요한 것은?</title>
<style>
:root{
  --bg:#f7fbff;
  --ink:#17324d;
  --muted:#6c7a89;
  --card:#ffffff;
  --line:#dfe8f1;
  --accent:#2a72d4;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#edf7ff 0%,#f9fbfd 38%,#ffffff 100%);
}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 44px}
.hero{
  background:#fff;
  border:1px solid var(--line);
  border-radius:28px;
  padding:28px 22px;
  box-shadow:0 12px 35px rgba(30,72,115,.09);
  text-align:center;
}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:800;color:#2563a8;
  background:#eaf4ff;border-radius:999px;padding:8px 12px;
}
h1{font-size:31px;line-height:1.2;margin:14px 0 10px;letter-spacing:-.8px}
.lead{font-size:16px;line-height:1.6;color:var(--muted);margin:0 auto 18px;max-width:560px}
.mascot{
  margin:14px auto 18px;
  width:160px;height:160px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#e9f6ff,#fff4dd);
}
.mascot svg{width:134px;height:134px}
.primary,.secondary{
  border:0;border-radius:16px;padding:15px 18px;font-size:16px;font-weight:800;cursor:pointer;
}
.primary{background:var(--accent);color:white;width:100%;box-shadow:0 8px 20px rgba(42,114,212,.2)}
.secondary{background:#eef3f8;color:#2f4a64}
.meta{margin-top:12px;color:#8a97a5;font-size:13px}
.screen{display:none}
.screen.active{display:block}
.progress{
  height:8px;background:#e8edf3;border-radius:99px;overflow:hidden;margin:18px 0 8px
}
.progress > div{height:100%;background:var(--accent);width:0;transition:.25s}
.qhead{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;margin:8px 0 14px}
.question{
  background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;
  box-shadow:0 10px 28px rgba(30,72,115,.07)
}
.question h2{font-size:23px;line-height:1.35;margin:0 0 18px;letter-spacing:-.4px}
.answers{display:grid;gap:10px}
.answer{
  display:flex;align-items:flex-start;gap:10px;text-align:left;
  width:100%;border:1px solid #dce6ef;background:#fff;border-radius:16px;
  padding:14px 15px;font-size:15px;line-height:1.45;cursor:pointer;color:#274057
}
.answer:hover{border-color:#8bb7e8;background:#f5faff}
.answer.selected{border:2px solid var(--accent);background:#eef6ff}
.emoji{font-size:22px;line-height:1.1}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1}
.result{
  border-radius:28px;padding:26px 20px;background:white;border:1px solid var(--line);
  box-shadow:0 12px 35px rgba(30,72,115,.09);text-align:center
}
.result .type{font-size:13px;font-weight:900;display:inline-block;border-radius:999px;padding:7px 11px;margin-bottom:8px}
.result h2{font-size:30px;margin:6px 0 10px;letter-spacing:-.6px}
.result .quote{font-size:18px;font-weight:800;line-height:1.45;margin:6px 0 12px}
.result p{color:#5f7082;line-height:1.65;margin:0 auto 16px;max-width:560px}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin:18px 0}
.mini{
  border-radius:16px;padding:14px;border:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.72)
}
.mini b{display:block;margin-bottom:6px;font-size:14px}
.mini span{font-size:13px;color:#5f7082;line-height:1.45}
.result-mascot{
  width:220px;height:180px;margin:6px auto 12px;border-radius:26px;
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden
}
.result-mascot .prop{font-size:54px;position:absolute;right:22px;bottom:16px;filter:drop-shadow(0 5px 6px rgba(0,0,0,.1))}
.hashtag{font-size:13px;font-weight:800;margin-top:10px}
.cta{
  margin-top:18px;padding:16px;border-radius:18px;background:#172c44;color:#fff;
  font-weight:900;font-size:17px;line-height:1.4
}
.footnote{font-size:12px;color:#8b96a3;line-height:1.5;margin-top:14px}
@media(max-width:560px){
  h1{font-size:27px}
  .question h2{font-size:21px}
  .result-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

<section id="intro" class="screen active">
  <div class="hero">
    <div class="badge">🌱 세종청년정책네트워크 · 직장인분과</div>
    <h1>세종에서 사는 나에게<br>중요한 것은?</h1>
    <p class="lead">6개의 질문으로 알아보는 나의 세종 라이프 유형.<br>가볍게 골라보고, 지금 내 삶에서 가장 필요한 것을 확인해보세요.</p>
    <div class="mascot" aria-label="이도 느낌 캐릭터 일러스트">
      <svg viewBox="0 0 180 180" role="img" aria-label="전통 갓을 쓴 귀여운 캐릭터">
        <ellipse cx="90" cy="58" rx="58" ry="13" fill="#20252b"/>
        <path d="M63 57 Q68 22 90 17 Q112 22 117 57Z" fill="#151a20"/>
        <circle cx="90" cy="91" r="43" fill="#ffe2c6"/>
        <circle cx="75" cy="88" r="4.8" fill="#25313b"/>
        <circle cx="105" cy="88" r="4.8" fill="#25313b"/>
        <path d="M80 104 Q90 112 100 104" fill="none" stroke="#b44d4d" stroke-width="4" stroke-linecap="round"/>
        <circle cx="65" cy="100" r="7" fill="#ffb6aa" opacity=".7"/>
        <circle cx="115" cy="100" r="7" fill="#ffb6aa" opacity=".7"/>
        <path d="M58 128 Q90 110 122 128 L128 169 L52 169Z" fill="#2d6fb2"/>
        <rect x="85" y="120" width="10" height="49" fill="#e8c26b"/>
        <circle cx="90" cy="136" r="9" fill="#f3d783"/>
      </svg>
    </div>
    <button class="primary" onclick="startQuiz()">테스트 시작하기 ✨</button>
    <div class="meta">약 1분 · 총 6문항 · 정답은 없어요!</div>
  </div>
</section>

<section id="quiz" class="screen">
  <div class="progress"><div id="bar"></div></div>
  <div class="qhead"><span id="qnum">1 / 6</span><span>나에게 더 가까운 답을 골라주세요</span></div>
  <div class="question">
    <h2 id="qtitle"></h2>
    <div id="answers" class="answers"></div>
  </div>
  <div class="nav">
    <button class="secondary" onclick="prevQ()">이전</button>
    <button class="primary" id="nextBtn" onclick="nextQ()" disabled>다음</button>
  </div>
</section>

<section id="result" class="screen">
  <div class="result" id="resultCard">
    <div class="type" id="rType"></div>
    <h2 id="rTitle"></h2>
    <div class="quote" id="rQuote"></div>

    <div class="result-mascot" id="resultMascot">
      <svg viewBox="0 0 180 180" style="width:150px;height:150px;z-index:2">
        <ellipse cx="90" cy="58" rx="58" ry="13" fill="#20252b"/>
        <path d="M63 57 Q68 22 90 17 Q112 22 117 57Z" fill="#151a20"/>
        <circle cx="90" cy="91" r="43" fill="#ffe2c6"/>
        <circle cx="75" cy="88" r="4.8" fill="#25313b"/>
        <circle cx="105" cy="88" r="4.8" fill="#25313b"/>
        <path d="M80 104 Q90 112 100 104" fill="none" stroke="#b44d4d" stroke-width="4" stroke-linecap="round"/>
        <circle cx="65" cy="100" r="7" fill="#ffb6aa" opacity=".7"/>
        <circle cx="115" cy="100" r="7" fill="#ffb6aa" opacity=".7"/>
        <path d="M58 128 Q90 110 122 128 L128 169 L52 169Z" fill="#2d6fb2"/>
        <rect x="85" y="120" width="10" height="49" fill="#e8c26b"/>
        <circle cx="90" cy="136" r="9" fill="#f3d783"/>
      </svg>
      <div class="prop" id="rProp"></div>
    </div>

    <p id="rDesc"></p>

    <div class="result-grid">
      <div class="mini"><b>내가 중요하게 보는 것</b><span id="rNeed"></span></div>
      <div class="mini"><b>연결되는 정책 주제</b><span id="rPolicy"></span></div>
    </div>

    <div class="hashtag" id="rHash"></div>
    <div class="cta">🎁 결과 화면을 운영진에게 보여주고<br>뽑기판 1회 참여하세요!</div>
    <button class="secondary" style="width:100%;margin-top:12px" onclick="restart()">다시 해보기</button>
    <div class="footnote">※ 본 테스트는 행사 참여용 간이 유형테스트로, 전문적인 성향 진단이 아닙니다.</div>
  </div>
</section>

</div>

<script>
const types = {
  health:{
    label:"🥗 건강충전형",
    title:"건강충전형",
    quote:"잘 먹고, 잘 쉬고, 건강하게!",
    desc:"몸과 마음이 건강해야 다른 것도 즐길 수 있다고 생각하는 당신. 세종에서의 삶에서도 건강한 식생활과 생활습관을 중요하게 보는 유형이에요.",
    need:"건강한 식사 · 운동 · 생활습관",
    policy:"영양 · 건강 · 생활체육",
    hash:"#건강 #영양 #생활체육",
    color:"#3fa55b",
    light:"#eaf8ee",
    prop:"🥗"
  },
  growth:{
    label:"📚 성장레벨업형",
    title:"성장레벨업형",
    quote:"배우는 오늘도 나를 성장시킨다!",
    desc:"새로운 것을 배우고 경험하면서 한 단계씩 성장하는 데 만족을 느끼는 당신. 교육, 자격증, 실무 경험 같은 기회를 중요하게 보는 유형이에요.",
    need:"교육 · 자격증 · 새로운 경험",
    policy:"청년교육 · 자기개발 · 역량강화",
    hash:"#교육 #자기개발 #청년역량",
    color:"#3478d4",
    light:"#eaf3ff",
    prop:"📚"
  },
  home:{
    label:"🏠 내집안정형",
    title:"내집안정형",
    quote:"든든한 집, 안정된 생활이 먼저!",
    desc:"안정적인 생활 기반이 있어야 마음 편히 미래를 계획할 수 있다고 생각하는 당신. 주거비 부담과 쾌적한 주거환경을 중요하게 보는 유형이에요.",
    need:"안정적인 집 · 주거비 부담 완화",
    policy:"주거 · 주거복지 · 정착지원",
    hash:"#주거 #주거복지 #안정",
    color:"#eb8a2f",
    light:"#fff3e7",
    prop:"🏠"
  },
  balance:{
    label:"🌿 워라밸행복형",
    title:"워라밸행복형",
    quote:"일도 중요하지만, 내 삶도 중요해!",
    desc:"열심히 일하는 만큼 충분히 쉬고 즐기는 것도 중요하다고 생각하는 당신. 문화, 여가, 휴식과 일·생활 균형을 중시하는 유형이에요.",
    need:"여가 · 휴식 · 문화생활",
    policy:"워라밸 · 문화여가 · 휴식지원",
    hash:"#워라밸 #여가 #문화생활",
    color:"#e95c91",
    light:"#fff0f6",
    prop:"☕"
  },
  connect:{
    label:"🤝 관계연결형",
    title:"관계연결형",
    quote:"함께라서 더 즐거운 세종!",
    desc:"좋은 사람들과 연결되고 함께 경험하는 것에서 에너지를 얻는 당신. 친구, 이웃, 커뮤니티와의 관계를 중요하게 보는 유형이에요.",
    need:"친구 · 이웃 · 커뮤니티",
    policy:"청년 네트워크 · 커뮤니티 · 참여",
    hash:"#커뮤니티 #네트워크 #연결",
    color:"#8057c7",
    light:"#f2edff",
    prop:"🤝"
  }
};

const questions = [
  {
    q:"세종에서 내 하루가 딱 하나 더 좋아진다면?",
    a:[
      ["건강하게 먹고 운동할 수 있는 환경","health","🥗"],
      ["배우고 도전할 기회가 더 많아졌으면","growth","📚"],
      ["주거비 부담이 줄고 안정적으로 살 수 있으면","home","🏠"],
      ["퇴근 후 쉴 시간과 즐길 거리가 더 많으면","balance","🌿"],
      ["새로운 사람들과 자연스럽게 만날 수 있으면","connect","🤝"]
    ]
  },
  {
    q:"뜻밖에 자유시간 1시간이 생겼다! 나는?",
    a:[
      ["운동하거나 산책하며 컨디션을 챙긴다","health","🏃"],
      ["미뤄둔 공부나 관심 분야를 찾아본다","growth","💡"],
      ["집 정리나 생활비 계획처럼 생활 기반을 챙긴다","home","🧾"],
      ["카페, 전시, 드라마 등 그냥 푹 쉰다","balance","☕"],
      ["친구에게 연락하거나 모임을 찾아본다","connect","💬"]
    ]
  },
  {
    q:"세종시에서 한 가지 지원을 받을 수 있다면?",
    a:[
      ["건강한 식생활·운동 지원","health","🥬"],
      ["교육비·자격증·직무교육 지원","growth","🎓"],
      ["월세·주거비·청년주택 지원","home","🔑"],
      ["문화·여가·휴식 프로그램 지원","balance","🎟️"],
      ["청년 모임·커뮤니티 활동 지원","connect","🫶"]
    ]
  },
  {
    q:"여윳돈 10만 원이 생기면 가장 먼저 하고 싶은 것은?",
    a:[
      ["건강식, 운동, 몸 관리에 쓴다","health","💪"],
      ["책, 강의, 자격증 등에 투자한다","growth","🧠"],
      ["저축하거나 주거·생활비에 보탠다","home","💰"],
      ["맛있는 것 먹고 문화생활하며 쉰다","balance","🎬"],
      ["친구나 가족과 함께 시간을 보낸다","connect","🍽️"]
    ]
  },
  {
    q:"내가 생각하는 '살기 좋은 세종'에 가장 가까운 모습은?",
    a:[
      ["건강하게 생활하기 좋은 도시","health","🌱"],
      ["배움과 도전 기회가 많은 도시","growth","🚀"],
      ["오래 정착해서 살기 좋은 도시","home","🏡"],
      ["일과 삶의 균형을 누릴 수 있는 도시","balance","🌇"],
      ["사람들이 서로 연결되는 따뜻한 도시","connect","👥"]
    ]
  },
  {
    q:"1년 뒤, 지금보다 가장 좋아졌으면 하는 것은?",
    a:[
      ["내 몸과 마음의 건강","health","❤️"],
      ["나의 능력과 커리어","growth","📈"],
      ["주거와 경제적 안정","home","🛋️"],
      ["삶의 여유와 행복감","balance","🌼"],
      ["좋은 사람들과의 관계","connect","🧑‍🤝‍🧑"]
    ]
  }
];

let idx=0;
let selected=Array(questions.length).fill(null);

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}
function startQuiz(){ show("quiz"); renderQ(); }
function renderQ(){
  const q=questions[idx];
  document.getElementById("qnum").textContent=(idx+1)+" / "+questions.length;
  document.getElementById("bar").style.width=((idx+1)/questions.length*100)+"%";
  document.getElementById("qtitle").textContent=q.q;
  const box=document.getElementById("answers");
  box.innerHTML="";
  q.a.forEach((a,i)=>{
    const btn=document.createElement("button");
    btn.className="answer"+(selected[idx]===i?" selected":"");
    btn.innerHTML='<span class="emoji">'+a[2]+'</span><span>'+a[0]+'</span>';
    btn.onclick=()=>{selected[idx]=i;renderQ();};
    box.appendChild(btn);
  });
  document.getElementById("nextBtn").disabled=selected[idx]===null;
  document.getElementById("nextBtn").textContent=idx===questions.length-1?"결과 보기":"다음";
}
function nextQ(){
  if(selected[idx]===null)return;
  if(idx<questions.length-1){idx++;renderQ();}else{calcResult();}
}
function prevQ(){ if(idx>0){idx--;renderQ();}else{show("intro");} }
function calcResult(){
  const score={health:0,growth:0,home:0,balance:0,connect:0};
  selected.forEach((s,qi)=>{
    const key=questions[qi].a[s][1];
    score[key]+=1;
  });
  const max=Math.max(...Object.values(score));
  let tied=Object.keys(score).filter(k=>score[k]===max);
  let winner=tied[0];

  // 동점이면 마지막 문항부터 거꾸로 보며, 동점 후보 중 최근 선택된 유형을 우선
  if(tied.length>1){
    for(let i=questions.length-1;i>=0;i--){
      const k=questions[i].a[selected[i]][1];
      if(tied.includes(k)){winner=k;break;}
    }
  }
  renderResult(winner);
}
function renderResult(key){
  const r=types[key];
  document.getElementById("rType").textContent=r.label;
  document.getElementById("rType").style.background=r.light;
  document.getElementById("rType").style.color=r.color;
  document.getElementById("rTitle").textContent=r.title;
  document.getElementById("rQuote").textContent="“"+r.quote+"”";
  document.getElementById("rDesc").textContent=r.desc;
  document.getElementById("rNeed").textContent=r.need;
  document.getElementById("rPolicy").textContent=r.policy;
  document.getElementById("rHash").textContent=r.hash;
  document.getElementById("rHash").style.color=r.color;
  document.getElementById("rProp").textContent=r.prop;
  document.getElementById("resultMascot").style.background="linear-gradient(145deg,"+r.light+",#ffffff)";
  document.getElementById("resultCard").style.borderColor=r.color+"55";
  show("result");
}
function restart(){
  idx=0; selected=Array(questions.length).fill(null);
  show("intro");
}
</script>
</body>
</html>
